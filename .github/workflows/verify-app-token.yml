name: Verify App Token (temporary)

# TEMPORARY. Proves the release-please GitHub App can mint a token and has the
# permissions the release path needs, before we depend on it there. Without
# this, a mistyped App ID, a mangled private key or an App that was created but
# never installed would only surface at the next release.
#
# DELETE THIS FILE once the run is green.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/verify-app-token.yml']

jobs:
  verify:
    name: Mint and exercise the App token
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Report identity and exercise permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "app-slug:        ${{ steps.app-token.outputs.app-slug }}"
          echo "installation-id: ${{ steps.app-token.outputs.installation-id }}"

          echo "--- contents: can it read the repo? ---"
          gh api "repos/${{ github.repository }}" --jq '.full_name'

          echo "--- pull requests: can it list them? ---"
          gh api "repos/${{ github.repository }}/pulls" --jq 'length'

          echo "--- permissions granted to this installation token ---"
          gh api "repos/${{ github.repository }}/installation" --jq '.permissions' \
            || echo "(installation endpoint not readable with this token; not fatal)"
