name: Release

# release-please owns the tag, the GitHub release and its notes. This workflow
# only builds the distribution for a released tag and attaches it as assets.
on:
  push:
    tags:
      - 'plan-manager-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to build and attach artifacts to (e.g. plan-manager-v0.13.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-artifacts:
    name: Build and Attach Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # verify.sh only infers the revision from a clean tree, and the tree is
      # never clean here: release-please bumps the version in pyproject.toml but
      # not in uv.lock, so `uv sync` above rewrites the lock. Read it from the
      # checked-out ref instead — not github.sha, which points at the default
      # branch when this workflow is dispatched with an explicit tag.
      - name: Pin the source revision
        run: echo "PLAN_MANAGER_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Same gate as CI, including the build and twine check that produce dist/.
      - name: Verify the released commit
        run: ./scripts/verify.sh

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
