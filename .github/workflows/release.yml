name: Release

# release-please owns the tag, the GitHub release and its notes. This workflow
# only builds the distribution for a released tag and attaches it as assets.
on:
  push:
    tags:
      - 'plan-manager-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to build and attach artifacts to (e.g. plan-manager-v0.13.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-artifacts:
    name: Build and Attach Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: |
          uv run pytest \
            --cov=src/plan_manager \
            --cov-report=term-missing \
            -v

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uv run twine check dist/*

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
