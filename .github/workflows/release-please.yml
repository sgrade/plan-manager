name: Release Please

on:
  push:
    branches:
      - main
  # Lets a failed or skipped run be retried without inventing a commit.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT cannot produce signed commits, so release PRs had to be merged
      # with `--squash --admin` to get past main's required_signatures rule.
      # Commits authored with a GitHub App token are signed by GitHub's
      # web-flow key, satisfying the rule instead of bypassing it. App tokens
      # also expire hourly, so there is no PAT to silently lapse between spikes.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
