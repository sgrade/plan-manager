repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        exclude: ^(\.devcontainer/|\.vscode/)
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

# mypy, bandit and pytest deliberately do NOT run here. This stage is for fast,
# staged-file checks only; the semantic checks need the real project
# environment and the whole tree, so `.githooks/pre-push` runs them via
# scripts/verify.sh. A mypy hook in pre-commit's isolated venv cannot see the
# project's dependencies and reaches different conclusions than CI does.
