# Mypy configuration file
# Note: Most configuration is in pyproject.toml, this is for IDE compatibility

[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
disallow_subclassing_any = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
pretty = True
show_error_codes = True
show_error_context = True
show_column_numbers = True

# No per-library overrides: every dependency ships types, and a missing-import
# error is a signal worth seeing rather than suppressing.
